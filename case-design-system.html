<style>

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--grotesque);color:var(--ink);background:var(--paper);min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;}

  .gate{position:relative;z-index:1;width:100%;max-width:440px;background:var(--paper-2);border:1px solid var(--hairline);
    border-radius:20px;padding:38px 34px 32px;box-shadow:0 30px 60px -34px rgba(28,27,23,.5);}

  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:10px;}
  h1{font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em;}
  h1 em{font-family:var(--grotesque);font-style:normal;font-weight:500;color:var(--coral);}
  p.desc{color:var(--ink-soft);font-size:14px;line-height:1.55;margin-top:12px;}
  form{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  input{font-family:var(--grotesque);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--hairline);background:#fff;color:var(--ink);}
  input:focus{outline:2px solid var(--coral);outline-offset:2px;}
  button{font-family:var(--grotesque);font-weight:600;font-size:14px;cursor:pointer;border:none;border-radius:999px;padding:13px 18px;
    background:var(--coral);color:#fff5ef;box-shadow:0 8px 22px -8px rgba(187,10,30,.7);transition:transform .2s;margin-top:4px;}
  button:hover{transform:translateY(-2px);}
  .err{color:var(--coral);font-size:13px;font-weight:600;min-height:18px;}
  .back{margin-top:18px;display:inline-block;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none;}
  .back:hover{color:var(--coral);}
</style>
